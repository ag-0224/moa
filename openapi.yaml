openapi: 3.1.0
info:
  title: MOA API Contract
  description: Single Source of Truth for MOA Spring Boot 3 Backend & Flutter Frontend REST API
  version: 1.0.0
servers:
  - url: http://localhost:8080/api/v1
    description: Local Development Server
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "POST /auth/login 응답의 accessToken을 'Authorization: Bearer <token>'으로 전달한다."
  schemas:
    ApiError:
      type: object
      properties:
        code:
          type: string
          example: INVALID_AUTH_TOKEN
        message:
          type: string
        details:
          type: array
          items:
            type: string
    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
          format: email
        name:
          type: string
        role:
          type: string
          enum: [USER, ADMIN]
        nickname:
          type: string
          nullable: true
          description: 회원가입(추가 정보 입력)을 완료하기 전까지는 null이다.
        major:
          type: string
          nullable: true
        studentId:
          type: string
          nullable: true
        profileCompleted:
          type: boolean
          description: >-
            false면 클라이언트는 회원가입 화면(추가 정보 입력)으로 이동시키고,
            true면 메인 화면으로 이동시킨다. nickname != null과 동치이다.
    LoginRequest:
      type: object
      required: [idToken]
      properties:
        idToken:
          type: string
          description: >-
            클라이언트(Flutter)가 Firebase Authentication으로 구글/애플 로그인을 완료한 뒤
            발급받는 Firebase ID Token.
    LoginResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: 이후 요청의 Authorization 헤더에 사용할 MOA 자체 발급 JWT.
        expiresInSeconds:
          type: integer
          format: int64
        user:
          $ref: '#/components/schemas/User'
    CompleteProfileRequest:
      type: object
      required: [name, nickname, major, studentId]
      properties:
        name:
          type: string
        nickname:
          type: string
        major:
          type: string
        studentId:
          type: string
paths:
  /health:
    get:
      summary: Health Check
      operationId: checkHealth
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: UP
                  timestamp:
                    type: string
                    example: "2026-08-28T10:00:00Z"
  /auth/login:
    post:
      summary: 구글/애플(Firebase) 로그인
      description: >-
        Firebase ID Token을 검증하고, 최초 로그인이면 사용자를 생성한 뒤 MOA 자체 액세스 토큰을 발급한다.
        이메일/비밀번호 로그인은 지원하지 않는다.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 로그인 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/LoginResponse'
                  error:
                    nullable: true
        '400':
          description: 요청 값이 올바르지 않음 (idToken 누락 등)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  data:
                    nullable: true
                  error:
                    $ref: '#/components/schemas/ApiError'
        '401':
          description: Firebase ID 토큰 검증 실패
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  data:
                    nullable: true
                  error:
                    $ref: '#/components/schemas/ApiError'
        '409':
          description: 이미 다른 로그인 제공자(Provider)로 가입된 이메일로 로그인 시도
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  data:
                    nullable: true
                  error:
                    $ref: '#/components/schemas/ApiError'
        '503':
          description: 서버에 Firebase 자격 증명(FIREBASE_CREDENTIALS_PATH)이 아직 설정되지 않음
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  data:
                    nullable: true
                  error:
                    $ref: '#/components/schemas/ApiError'
  /users/me:
    get:
      summary: 내 정보 조회
      operationId: getMyInfo
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/User'
                  error:
                    nullable: true
        '401':
          description: 인증되지 않음 (Authorization 헤더 누락/만료/위조된 토큰)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  data:
                    nullable: true
                  error:
                    $ref: '#/components/schemas/ApiError'
    patch:
      summary: 회원가입(추가 정보 입력) 완료
      description: >-
        회원가입 화면('회원 정보 입력')의 '작성 완료' 버튼이 호출한다. 성공하면 응답의
        profileCompleted가 true로 바뀐다.
      operationId: completeProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteProfileRequest'
      responses:
        '200':
          description: 저장 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/User'
                  error:
                    nullable: true
        '400':
          description: 요청 값이 올바르지 않음 (필수 항목 누락)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  data:
                    nullable: true
                  error:
                    $ref: '#/components/schemas/ApiError'
        '401':
          description: 인증되지 않음
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  data:
                    nullable: true
                  error:
                    $ref: '#/components/schemas/ApiError'
        '409':
          description: 이미 다른 사용자가 사용 중인 닉네임
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  data:
                    nullable: true
                  error:
                    $ref: '#/components/schemas/ApiError'
