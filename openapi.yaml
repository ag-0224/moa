openapi: 3.1.0
info:
  title: MOA API Contract
  description: Single Source of Truth for MOA Spring Boot 3 Backend & Flutter Frontend REST API
  version: 1.0.0
servers:
  - url: http://localhost:8080/api/v1
    description: Local Development Server
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "POST /auth/login 응답의 accessToken을 'Authorization: Bearer <token>'으로 전달한다."
  schemas:
    ApiError:
      type: object
      properties:
        code:
          type: string
          example: INVALID_AUTH_TOKEN
        message:
          type: string
        details:
          type: array
          items:
            type: string
    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
          format: email
        name:
          type: string
        role:
          type: string
          enum: [USER, ADMIN]
        nickname:
          type: string
          nullable: true
          description: 회원가입(추가 정보 입력)을 완료하기 전까지는 null이다.
        major:
          type: string
          nullable: true
        studentId:
          type: string
          nullable: true
        profileCompleted:
          type: boolean
          description: >-
            false면 클라이언트는 회원가입 화면(추가 정보 입력)으로 이동시키고,
            true면 메인 화면으로 이동시킨다. nickname != null과 동치이다.
    LoginRequest:
      type: object
      required: [idToken]
      properties:
        idToken:
          type: string
          description: >-
            클라이언트(Flutter)가 Firebase Authentication으로 구글/애플 로그인을 완료한 뒤
            발급받는 Firebase ID Token.
    LoginResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: 이후 요청의 Authorization 헤더에 사용할 MOA 자체 발급 JWT.
        expiresInSeconds:
          type: integer
          format: int64
        user:
          $ref: '#/components/schemas/User'
    CompleteProfileRequest:
      type: object
      required: [name, nickname, major, studentId]
      properties:
        name:
          type: string
        nickname:
          type: string
        major:
          type: string
        studentId:
          type: string
    Club:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        leaderName:
          type: string
        category:
          type: string
        memberCount:
          type: integer
        thumbnailUrl:
          type: string
          nullable: true
        joined:
          type: boolean
          description: 로그인한 사용자가 이 동아리에 가입했는지 여부.
        favorite:
          type: boolean
          description: 로그인한 사용자가 이 동아리를 즐겨찾기했는지 여부. joined가 false면 항상 false다.
        leader:
          type: boolean
          description: >-
            로그인한 사용자가 이 동아리의 관리자(동아리장)인지 여부. clubs.leader_id와
            로그인한 사용자 ID를 비교해서 서버가 판단한다 — leaderName(표시용
            문자열) 비교가 아니라 실제 FK 기준이라 동명이인이 있어도 정확하다.
            joined가 false면 항상 false다.
    SetClubFavoriteRequest:
      type: object
      required: [favorite]
      properties:
        favorite:
          type: boolean
    TransferClubLeaderRequest:
      type: object
      required: [newLeaderId]
      properties:
        newLeaderId:
          type: integer
          format: int64
          description: 관리자 권한을 넘겨받을 대상의 User ID. 반드시 이 동아리의 기존 가입 멤버여야 한다.
    ClubMemberSummary:
      type: object
      properties:
        userId:
          type: integer
          format: int64
        name:
          type: string
        leader:
          type: boolean
          description: 이 멤버가 현재 동아리장인지 여부.
    ClubApplication:
      type: object
      properties:
        id:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        applicantName:
          type: string
        selfIntroduction:
          type: string
        status:
          type: string
          enum: [PENDING, APPROVED, REJECTED]
        appliedAt:
          type: string
          format: date-time
    ClubDetail:
      allOf:
        - $ref: '#/components/schemas/Club'
        - type: object
          properties:
            description:
              type: string
              nullable: true
              description: 가입 전 소개(동아리 상세 화면)에만 노출되는 소개 글.
            applicationStatus:
              type: string
              enum: [PENDING, REJECTED]
              nullable: true
              description: >-
                joined가 true면 항상 null이다. joined가 false일 때만
                null(아직 신청 안 함)/PENDING(승인 대기)/REJECTED(거절됨,
                재신청 가능) 중 하나가 온다.
    ApplyClubRequest:
      type: object
      required: [selfIntroduction]
      properties:
        selfIntroduction:
          type: string
          minLength: 20
          maxLength: 1000
    AttendanceMark:
      type: string
      enum: [PRESENT, ABSENT, VACATION, UPCOMING]
      description: >-
        하루치 출석 표시 상태. PRESENT/VACATION은 attendance_records에 실제로
        저장된 값이고, ABSENT(지나간 날짜인데 기록이 없음)와 UPCOMING(오늘 중
        아직 정하지 않았거나 미래의 날짜)은 서버가 계산해서 채운다.
    MemberAttendance:
      type: object
      properties:
        memberId:
          type: integer
          format: int64
          description: 그 인원의 User ID.
        name:
          type: string
        isMe:
          type: boolean
          description: 로그인한 사용자 본인의 행인지 여부.
        todayMark:
          $ref: '#/components/schemas/AttendanceMark'
        weeklyMarks:
          type: array
          description: 이번 주 월~일 7일치 출석 도장.
          items:
            $ref: '#/components/schemas/AttendanceMark'
          minItems: 7
          maxItems: 7
        vacationDaysUsed:
          type: integer
          description: 이번 학기 누적 휴가 사용 일수.
    AttendanceOverview:
      type: object
      properties:
        weekStart:
          type: string
          format: date
          description: 이번 주 월요일 날짜.
        members:
          type: array
          items:
            $ref: '#/components/schemas/MemberAttendance'
        myVacationDaysUsed:
          type: integer
        myVacationDaysTotal:
          type: integer
    CheckInRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          pattern: '^\d{4}$'
          description: 오늘의 출석번호 4자리.
    MyStudyInfo:
      type: object
      properties:
        year:
          type: integer
        month:
          type: integer
        dailyMarks:
          type: object
          description: >-
            그 달의 day-of-month(문자열 "1"~"31") -> AttendanceMark. 지나지
            않은 날(오늘 중 아직 정하지 않은 경우 포함)과 스터디가 아직
            만들어지기 전 날짜(studyCreatedAt 이전)는 둘 다 이 맵에 없다.
          additionalProperties:
            $ref: '#/components/schemas/AttendanceMark'
        presentCount:
          type: integer
        absentCount:
          type: integer
        vacationDaysUsed:
          type: integer
        vacationDaysTotal:
          type: integer
        studyCreatedAt:
          type: string
          format: date
          description: >-
            이 스터디가 만들어진 날짜. 조회한 달과 무관하게 항상 같은 값을
            돌려준다 — 프론트엔드가 월 이동 화살표/달력 선택의 하한선으로 쓴다.
paths:
  /health:
    get:
      summary: Health Check
      operationId: checkHealth
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: UP
                  timestamp:
                    type: string
                    example: "2026-08-28T10:00:00Z"
  /auth/login:
    post:
      summary: 구글/애플(Firebase) 로그인
      description: >-
        Firebase ID Token을 검증하고, 최초 로그인이면 사용자를 생성한 뒤 MOA 자체 액세스 토큰을 발급한다.
        이메일/비밀번호 로그인은 지원하지 않는다.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 로그인 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/LoginResponse'
                  error:
                    nullable: true
        '400':
          description: 요청 값이 올바르지 않음 (idToken 누락 등)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  data:
                    nullable: true
                  error:
                    $ref: '#/components/schemas/ApiError'
        '401':
          description: Firebase ID 토큰 검증 실패
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  data:
                    nullable: true
                  error:
                    $ref: '#/components/schemas/ApiError'
        '409':
          description: 이미 다른 로그인 제공자(Provider)로 가입된 이메일로 로그인 시도
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  data:
                    nullable: true
                  error:
                    $ref: '#/components/schemas/ApiError'
        '503':
          description: 서버에 Firebase 자격 증명(FIREBASE_CREDENTIALS_PATH)이 아직 설정되지 않음
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  data:
                    nullable: true
                  error:
                    $ref: '#/components/schemas/ApiError'
  /clubs/me:
    get:
      summary: 내가 가입한 동아리 목록
      operationId: getMyClubs
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Club'
                  error:
                    nullable: true
        '401':
          description: 인증되지 않음
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  data:
                    nullable: true
                  error:
                    $ref: '#/components/schemas/ApiError'
  /clubs:
    get:
      summary: 전체 동아리 목록 (메인 페이지 홈 피드)
      description: >-
        로그인한 사용자 기준으로 각 동아리의 joined/favorite 여부를 함께 내려준다.
      operationId: getAllClubs
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Club'
                  error:
                    nullable: true
        '401':
          description: 인증되지 않음
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  data:
                    nullable: true
                  error:
                    $ref: '#/components/schemas/ApiError'
    post:
      summary: 스터디(동아리) 등록
      description: >-
        메인 페이지 "스터디 등록" 버튼 → 등록 화면의 "작성완료" 제출. 사진(thumbnail)
        파일을 함께 받기 위해 JSON이 아니라 multipart/form-data로 받는다. 등록한
        사용자가 곧바로 그 스터디의 회장 겸 첫 멤버가 된다(joined=true로 응답).
        name이 비어있거나 100자를 넘으면 INVALID_CLUB_NAME(400), 이미 존재하는
        이름이면 DUPLICATE_CLUB_NAME(409)을 반환한다.
      operationId: createClub
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - name
                - description
              properties:
                name:
                  type: string
                  maxLength: 100
                description:
                  type: string
                thumbnail:
                  type: string
                  format: binary
      responses:
        '200':
          description: 등록 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/ClubDetail'
                  error:
                    nullable: true
        '400':
          description: 이름이 비어있거나 형식이 올바르지 않음 (INVALID_CLUB_NAME)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  data:
                    nullable: true
                  error:
                    $ref: '#/components/schemas/ApiError'
        '401':
          description: 인증되지 않음
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  data:
                    nullable: true
                  error:
                    $ref: '#/components/schemas/ApiError'
        '409':
          description: 이미 존재하는 스터디 이름 (DUPLICATE_CLUB_NAME)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  data:
                    nullable: true
                  error:
                    $ref: '#/components/schemas/ApiError'
  /clubs/{clubId}/favorite:
    patch:
      summary: 동아리 즐겨찾기 설정
      description: 가입한 동아리에 대해서만 즐겨찾기를 설정할 수 있다.
      operationId: setClubFavorite
      security:
        - bearerAuth: []
      parameters:
        - name: clubId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetClubFavoriteRequest'
      responses:
        '200':
          description: 변경 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Club'
                  error:
                    nullable: true
        '401':
          description: 인증되지 않음
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  data:
                    nullable: true
                  error:
                    $ref: '#/components/schemas/ApiError'
        '404':
          description: 존재하지 않는 동아리이거나(CLUB_NOT_FOUND), 가입하지 않은 동아리를 즐겨찾기하려 함(CLUB_MEMBERSHIP_NOT_FOUND)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  data:
                    nullable: true
                  error:
                    $ref: '#/components/schemas/ApiError'
  /clubs/{clubId}:
    get:
      summary: 동아리 상세(가입 전 소개/지원) 조회
      operationId: getClubDetail
      security:
        - bearerAuth: []
      parameters:
        - name: clubId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/ClubDetail'
                  error:
                    nullable: true
        '401':
          description: 인증되지 않음
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  data:
                    nullable: true
                  error:
                    $ref: '#/components/schemas/ApiError'
        '404':
          description: 존재하지 않는 동아리(CLUB_NOT_FOUND)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  data:
                    nullable: true
                  error:
                    $ref: '#/components/schemas/ApiError'
  /clubs/{clubId}/apply:
    post:
      summary: 동아리 가입 신청 ('지원 하기')
      description: >-
        가입하지 않은 동아리에 자기소개와 함께 가입을 신청한다. 신청은 PENDING
        상태로 생성되며, 동아리장 승인/거절 기능은 아직 없다(이번 범위 밖).
        REJECTED 상태의 기존 신청서가 있으면 재신청으로 처리되어 같은 신청서가
        새 자기소개로 갱신되고 다시 PENDING이 된다.
      operationId: applyToClub
      security:
        - bearerAuth: []
      parameters:
        - name: clubId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyClubRequest'
      responses:
        '200':
          description: 신청 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/ClubDetail'
                  error:
                    nullable: true
        '400':
          description: 요청 값이 올바르지 않음 (자기소개 누락/길이 미달)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  data:
                    nullable: true
                  error:
                    $ref: '#/components/schemas/ApiError'
        '401':
          description: 인증되지 않음
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  data:
                    nullable: true
                  error:
                    $ref: '#/components/schemas/ApiError'
        '404':
          description: 존재하지 않는 동아리(CLUB_NOT_FOUND)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  data:
                    nullable: true
                  error:
                    $ref: '#/components/schemas/ApiError'
        '409':
          description: 이미 가입함(CLUB_ALREADY_JOINED) 또는 이미 승인 대기 중인 신청서가 있음(CLUB_APPLICATION_ALREADY_PENDING)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  data:
                    nullable: true
                  error:
                    $ref: '#/components/schemas/ApiError'
  /clubs/{clubId}/members:
    get:
      summary: 동아리 멤버 목록
      description: >-
        관리자 권한 넘기기 화면(멤버 선택)에서 쓴다. 가입한 사용자만 조회할 수
        있다 — 가입하지 않은 동아리를 조회하면 CLUB_MEMBERSHIP_NOT_FOUND(404).
      operationId: getClubMembers
      security:
        - bearerAuth: []
      parameters:
        - name: clubId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ClubMemberSummary'
                  error:
                    nullable: true
        '401':
          description: 인증되지 않음
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  data:
                    nullable: true
                  error:
                    $ref: '#/components/schemas/ApiError'
        '404':
          description: 존재하지 않는 동아리(CLUB_NOT_FOUND) 또는 가입하지 않음(CLUB_MEMBERSHIP_NOT_FOUND)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  data:
                    nullable: true
                  error:
                    $ref: '#/components/schemas/ApiError'
  /clubs/{clubId}/leader:
    patch:
