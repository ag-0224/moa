spring:
  application:
    name: moa-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  # "스터디 등록" 화면의 사진 업로드(ClubController#createClub) 요청 크기 제한.
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: ${SERVER_PORT:8080}

jwt:
  secret: ${JWT_SECRET:moa_dev_secret_jwt_key_super_secure_2026_default_local_key}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

app:
  # FileStorageService가 업로드된 파일(스터디 사진 등)을 저장하는 로컬 디스크 경로.
  # 상대 경로면 서버 프로세스의 실행 디렉터리 기준이다. 여러 인스턴스로 배포하게
  # 되면 이 로컬 디스크 방식은 더 이상 맞지 않으므로 S3 등으로 옮겨야 한다.
  upload:
    dir: ${APP_UPLOAD_DIR:uploads}

---
spring:
  config:
    activate:
      on-profile: local
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false
  datasource:
    url: jdbc:h2:mem:moa;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:moa_db}
    username: ${DB_USERNAME:moa_user}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

---
spring:
  config:
    activate:
      on-profile: docker
  # Moarium과 동일한 MySQL 8 컨테이너에 연결하는 로컬 Docker 프로필.
  # 주의: 루트 schema.sql은 PostgreSQL 전용 문법(BIGSERIAL, TIMESTAMP WITH TIME ZONE)을
  # 사용하므로 MySQL에는 그대로 적용할 수 없다. 계약(schema.sql)을 임의로 바꾸지 않기 위해
  # 이 프로필은 스키마 계약 대신 Hibernate DDL 생성(ddl-auto=update)으로 테이블을 만든다.
  # 실제 배포용 스키마 동기화가 필요해지면 계약 변경 절차(AGENTS.md §4)에 따라 논의한다.
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:moa_db}?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&useUnicode=true&serverTimezone=Asia/Seoul
    username: ${DB_USERNAME:moa_user}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
