spring:
  application:
    name: moa-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

server:
  port: ${SERVER_PORT:8080}

jwt:
  secret: ${JWT_SECRET:}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:moa;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:moa_db}
    username: ${DB_USERNAME:moa_user}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

---
spring:
  config:
    activate:
      on-profile: docker
  # Moarium과 동일한 MySQL 8 컨테이너에 연결하는 로컬 Docker 프로필.
  # 주의: 루트 schema.sql은 PostgreSQL 전용 문법(BIGSERIAL, TIMESTAMP WITH TIME ZONE)을
  # 사용하므로 MySQL에는 그대로 적용할 수 없다. 계약(schema.sql)을 임의로 바꾸지 않기 위해
  # 이 프로필은 스키마 계약 대신 Hibernate DDL 생성(ddl-auto=update)으로 테이블을 만든다.
  # 실제 배포용 스키마 동기화가 필요해지면 계약 변경 절차(AGENTS.md §4)에 따라 논의한다.
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:moa_db}?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&useUnicode=true&serverTimezone=Asia/Seoul
    username: ${DB_USERNAME:moa_user}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
