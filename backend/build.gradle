plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.5'
    id 'io.spring.dependency-management' version '1.1.4'
}

group = 'com.moa'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = '17'
}

repositories {
    mavenCentral()
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

dependencies {
    // Web / API
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.5.0'

    // Security & JWT
    // Firebase Admin SDK: 클라이언트(Flutter, Firebase Auth)가 구글/애플 로그인 후 발급받은
    // ID Token을 서버에서 검증하는 데 사용한다 (POST /auth/login).
    implementation 'com.google.firebase:firebase-admin:9.3.0'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    // 로그인(POST /auth/login) 성공 후 발급되는 MOA 자체 액세스 토큰
    implementation 'io.jsonwebtoken:jjwt-api:0.12.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.5'

    // Persistence
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'com.mysql:mysql-connector-j'
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'com.h2database:h2'

    // 로컬 개발 편의: 컨트롤러/서비스 코드를 고치고 재빌드하면(예: IDE의
    // "Build Project") 서버가 자동으로 재시작된다. developmentOnly라서
    // 실행 가능한 jar(운영 배포용)에는 포함되지 않는다. 이게 없으면 코드를
    // 고쳐도 이미 떠 있는 서버 프로세스는 그대로라서, 새로 만든 엔드포인트를
    // 호출하면 405/404가 나는 것처럼 보일 수 있다(POST /clubs 405가 그 예).
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
}

tasks.named('test') {
    useJUnitPlatform()
}
