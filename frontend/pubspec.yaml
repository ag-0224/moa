name: moa
description: MOA Flutter frontend (Google/Apple 로그인 + MOA REST API 연동)
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter

  # 상태 관리 (docs/PROJECT_CONTEXT.md: Riverpod). codegen 없이 flutter_riverpod만 사용해
  # build_runner 없이도 바로 빌드할 수 있게 한다.
  flutter_riverpod: ^2.5.1

  # HTTP 클라이언트 (docs/PROJECT_CONTEXT.md: Dio)
  dio: ^5.4.3+1

  # 로그인 - 구글/애플 → Firebase Authentication (ADR 002, docs/DECISIONS.md)
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.3
  crypto: ^3.0.3

  # POST /auth/login으로 발급받은 MOA 액세스 토큰을 기기에 안전하게 보관
  flutter_secure_storage: ^9.2.2

  cupertino_icons: ^1.0.8

  # 스플래시 화면 등에서 벡터(SVG) 로고를 그리기 위해 사용 (assets/default_logo.svg).
  # TechTalk 프로젝트와 동일한 패키지.
  flutter_svg: ^2.0.10+1

  # "스터디 등록" 화면에서 갤러리 사진을 골라 썸네일로 업로드하는 데 사용.
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/icons/
